<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-5bcbf230-5e9f-43e2-a53f-75efdb945128/styles.css">
<script src="_ds/industry-5bcbf230-5e9f-43e2-a53f-75efdb945128/_ds_bundle.js"></script>
<style>
body { background: #fafafa; }
</style>
</helmet>
<div style="min-height:100vh;background:#fafafa;color:#1d1f20;font-family:var(--font-body);padding:40px 32px 64px;display:flex;justify-content:center">
  <div style="width:100%;max-width:1240px;display:flex;flex-direction:column;gap:28px">

    <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9ca3af">Date Marking</span>
        <h1 style="font-family:var(--font-heading);font-size:36px;line-height:1;font-weight:600;margin:0">日期點選標記系統</h1>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px;color:#6b7280">
        <span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">已標記</span>
        <span style="font-family:var(--font-heading);font-size:28px;line-height:1;font-weight:600;color:#1d1f20">{{ markedCount }}</span>
        <span style="font-size:12px">天</span>
      </div>
    </header>

    <section style="background:#fff;border:1px solid #eceef1;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:22px 24px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <h2 style="font-family:var(--font-heading);font-size:17px;font-weight:600;margin:0;letter-spacing:.02em;color:#374151">選擇月份 · {{ rangeLabel }}</h2>
        <div style="display:flex;gap:6px">
          <button style="{{ ghostBtn }}" onClick="{{ selectAllMonths }}">全選</button>
          <button style="{{ ghostBtn }}" onClick="{{ clearMonths }}">清除月份</button>
          <button style="{{ ghostBtn }}" onClick="{{ clearDays }}">清除標記</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
        <sc-for list="{{ months }}" as="m" hint-placeholder-count="12">
          <label style="{{ m.chipStyle }}">
            <input type="checkbox" checked="{{ m.checked }}" onChange="{{ m.toggle }}" style="width:15px;height:15px;accent-color:#6f95c4;margin:0;cursor:pointer">
            <span style="font-family:var(--font-heading);font-size:15px;letter-spacing:.04em">{{ m.label }}</span>
          </label>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:12px;border-top:1px solid #f1f2f4;padding-top:16px">
        <span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af">標記顏色</span>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ palette }}" as="p" hint-placeholder-count="5">
            <button style="{{ p.style }}" onClick="{{ p.pick }}" title="{{ p.name }}"></button>
          </sc-for>
        </div>
      </div>
    </section>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="background:#fff;border:1px dashed #dfe3e8;border-radius:16px;padding:56px;text-align:center;color:#9ca3af;font-size:14px">
        請於上方勾選月份，月曆將顯示於此。
      </div>
    </sc-if>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px">
      <sc-for list="{{ grids }}" as="g" hint-placeholder-count="2">
        <div style="background:#fff;border:1px solid #eceef1;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:26px 24px 20px;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <h3 style="font-family:var(--font-heading);font-size:24px;font-weight:600;margin:0;letter-spacing:.01em">{{ g.name }}</h3>
            <span style="font-family:var(--font-heading);font-size:14px;letter-spacing:.14em;color:#9ca3af">{{ g.code }}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;user-select:none">
            <sc-for list="{{ g.heads }}" as="h" hint-placeholder-count="7">
              <div style="{{ h.style }}">{{ h.label }}</div>
            </sc-for>
            <sc-for list="{{ g.cells }}" as="c" hint-placeholder-count="35">
              <button style="{{ c.style }}" onMouseDown="{{ c.onDown }}" onMouseEnter="{{ c.onEnter }}" onClick="{{ c.onClick }}" disabled="{{ c.blank }}">{{ c.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;weekStart&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;SUN&quot;,&quot;MON&quot;],&quot;default&quot;:&quot;SUN&quot;,&quot;tsType&quot;:&quot;'SUN'|'MON'&quot;,&quot;section&quot;:&quot;月曆&quot;}}">
// ── Calendar constants ──────────────────────────────────────────────────────
// The selectable months, in order: three before the current month, the
// current month, and eight after — worked out once when the page loads. Each
// entry carries its own year, since the range usually crosses a year boundary.
const NOW = new Date();
const MONTHS = [];
for (let k = -3; k <= 8; k++) {
  const d = new Date(NOW.getFullYear(), NOW.getMonth() + k, 1);
  MONTHS.push({ y: d.getFullYear(), mi: d.getMonth() });
}
const WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ALL_MONTHS = MONTHS.map((_, i) => i);

const PALETTE = [
  { id:'blue',   name:'藍', bg:'#DCEBFF', fg:'#3f5f8f', ring:'#C4DCFF' },
  { id:'purple', name:'紫', bg:'#E7DEFA', fg:'#6b52a8', ring:'#D6C9F5' },
  { id:'green',  name:'綠', bg:'#D6F2E3', fg:'#3d7d57', ring:'#BEE6D2' },
  { id:'yellow', name:'黃', bg:'#FFF0C5', fg:'#9a7420', ring:'#F7E3A8' },
  { id:'red',    name:'紅', bg:'#FFE0E0', fg:'#a34848', ring:'#F7C9C9' }
];
const BY_ID = Object.fromEntries(PALETTE.map(p => [p.id, p]));

// Greys and tints shared by the styles below. The five marking colours live in
// PALETTE; nothing else here should introduce a new hue.
const C = {
  text:      '#374151',
  muted:     '#9ca3af',
  weekend:   '#c2c7d0',
  line:      '#ececef',
  ground:    '#fafafa',
  pickBg:    '#EEF5FF',
  pickLine:  '#C4DCFF',
  ghostText: '#6b7280'
};

const pad2 = n => String(n).padStart(2, '0');
const dayKey = (y, mi, d) => y + '-' + pad2(mi + 1) + '-' + pad2(d);
const weekdayOf = (y, mi, d) => new Date(y, mi, d).getDay();
const daysIn = (y, mi) => new Date(y, mi + 1, 0).getDate();
const monthLabel = m => m.y + '/' + pad2(m.mi + 1);
const isWeekend = wd => wd === 0 || wd === 6;

// ── Inline styles ───────────────────────────────────────────────────────────
// Strings rather than CSS classes because a .dc.html template binds style="",
// which is how the runtime and the rest of this component are written.
const headStyle = wd =>
  'font-size:11px;font-weight:500;letter-spacing:.1em;text-align:center;padding:4px 0 8px;color:' +
  (isWeekend(wd) ? C.weekend : C.muted);

const DAY_BASE = 'appearance:none;border:none;font-family:var(--font-body);font-size:14px;font-weight:500;line-height:1;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .12s,color .12s,box-shadow .12s;';
const PAD_STYLE = DAY_BASE + 'background:transparent;cursor:default;';

const dayStyle = (mark, weekend) => DAY_BASE + 'cursor:pointer;' + (mark
  ? 'background:' + mark.bg + ';color:' + mark.fg + ';font-weight:600;box-shadow:inset 0 0 0 1px ' + mark.ring + ';'
  : 'background:transparent;color:' + (weekend ? C.weekend : C.text) + ';');

const chipStyle = checked =>
  'display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;user-select:none;transition:background .12s,box-shadow .12s;background:' +
  (checked ? C.pickBg : C.ground) + ';box-shadow:inset 0 0 0 1px ' + (checked ? C.pickLine : C.line) + ';';

const swatchStyle = (p, active) =>
  'width:26px;height:26px;border:none;border-radius:8px;cursor:pointer;background:' + p.bg +
  ';box-shadow:inset 0 0 0 1px ' + p.ring + (active ? ',0 0 0 2px #fff,0 0 0 3px ' + p.fg : '') + ';';

const GHOST_STYLE = 'appearance:none;background:transparent;border:1px solid ' + C.line +
  ';border-radius:8px;padding:6px 12px;font-family:var(--font-body);font-size:12px;color:' +
  C.ghostText + ';cursor:pointer';

// ── Marking rules ───────────────────────────────────────────────────────────
// The single source of truth for what a press does to a cell, shared by the
// click path and the drag path so the two can never drift apart: a mark
// already in the selected colour clears, anything else takes the colour.
const modeFor = (days, key, color) => (days[key] === color ? 'clear' : 'mark');

// Idempotent, so re-entering a cell during the same drag is harmless.
const applied = (days, key, mode, color) => {
  const d = Object.assign({}, days);
  if (mode === 'mark') d[key] = color; else delete d[key];
  return d;
};

class Component extends DCLogic {
  state = { months: [], days: {}, color: 'blue', drag: null };

  componentDidMount() {
    // A drag can end anywhere — a gap between cells, another section, off the
    // page — so the release is caught on the window rather than on a cell.
    this.onWindowUp = () => this.endDrag();
    window.addEventListener('mouseup', this.onWindowUp);
  }
  componentWillUnmount() {
    window.removeEventListener('mouseup', this.onWindowUp);
  }

  // ── Which months are on screen ────────────────────────────────────────────
  toggleMonth(i) {
    this.setState(s => ({
      months: s.months.includes(i)
        ? s.months.filter(x => x !== i)
        : s.months.concat(i).sort((a, b) => a - b)
    }));
  }

  // ── Marking: click ────────────────────────────────────────────────────────
  toggleDay(key) {
    this.setState(s => ({ days: applied(s.days, key, modeFor(s.days, key, s.color), s.color) }));
  }

  // ── Marking: drag ─────────────────────────────────────────────────────────
  // The anchor decides the whole stroke: press on a cell that already carries
  // the selected colour and the drag erases, otherwise it paints.
  startDrag(key) {
    this.setState(s => {
      const mode = modeFor(s.days, key, s.color);
      return { drag: mode, days: applied(s.days, key, mode, s.color) };
    });
  }
  enterDay(key, e) {
    const mode = this.state.drag;
    if (!mode) return;
    // The window mouseup never fires if the button was released outside the
    // browser; buttons === 0 catches that on the way back in.
    if (e.buttons === 0) { this.endDrag(); return; }
    this.setState(s => ({ days: applied(s.days, key, mode, s.color) }));
  }
  endDrag() {
    if (this.state.drag) this.setState({ drag: null });
  }

  // ── Render data ───────────────────────────────────────────────────────────
  // Every value the template binds to is assembled here; the template itself
  // holds no logic.
  renderVals() {
    const weekStart = this.props.weekStart === 'MON' ? 1 : 0;

    // One shared row of weekday headings — the same for every month grid.
    const heads = [];
    for (let i = 0; i < 7; i++) {
      const wd = (i + weekStart) % 7;
      heads.push({ label: WD[wd], style: headStyle(wd) });
    }

    return {
      grids: this.state.months.map(i => {
        const { y, mi } = MONTHS[i];
        return {
          name: MN[mi],
          code: y + ' / ' + pad2(mi + 1),
          heads: heads,
          cells: this.cellsFor(y, mi, weekStart)
        };
      }),

      months: ALL_MONTHS.map(i => {
        const checked = this.state.months.includes(i);
        return {
          label: monthLabel(MONTHS[i]),
          checked: checked,
          toggle: () => this.toggleMonth(i),
          chipStyle: chipStyle(checked)
        };
      }),

      palette: PALETTE.map(p => ({
        name: p.name,
        pick: () => this.setState({ color: p.id }),
        style: swatchStyle(p, this.state.color === p.id)
      })),

      rangeLabel: monthLabel(MONTHS[0]) + ' – ' + monthLabel(MONTHS[MONTHS.length - 1]),
      isEmpty: this.state.months.length === 0,
      markedCount: Object.keys(this.state.days).length,
      ghostBtn: GHOST_STYLE,
      selectAllMonths: () => this.setState({ months: ALL_MONTHS.slice() }),
      clearMonths: () => this.setState({ months: [] }),
      clearDays: () => this.setState({ days: {} })
    };
  }

  // Leading blanks to line day 1 up under its weekday, then one cell per day.
  cellsFor(y, mi, weekStart) {
    const cells = [];
    const lead = (weekdayOf(y, mi, 1) - weekStart + 7) % 7;
    for (let i = 0; i < lead; i++) {
      cells.push({ label: '', blank: true, onDown: null, onEnter: null, onClick: null, style: PAD_STYLE });
    }
    for (let d = 1, n = daysIn(y, mi); d <= n; d++) {
      const key = dayKey(y, mi, d);
      cells.push({
        label: String(d),
        blank: false,
        onDown: () => this.startDrag(key),
        onEnter: e => this.enterDay(key, e),
        // mousedown has already marked this cell, so a mouse click must not
        // toggle it back. detail === 0 only for keyboard-activated clicks
        // (Enter / Space), which is the path this handler exists to serve.
        onClick: e => { if (e.detail === 0) this.toggleDay(key); },
        style: dayStyle(BY_ID[this.state.days[key]], isWeekend(weekdayOf(y, mi, d)))
      });
    }
    return cells;
  }
}
</script>
</body>
</html>
